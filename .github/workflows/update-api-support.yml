name: Update OpenAI API support

on:
  schedule:
    - cron: '23 0 * * 1' # Monday 00:23 UTC / 09:23 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-api-capability-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check official OpenAI specification, guide, and retirements
        run: python scripts/sync_capabilities.py
      - name: Validate updated node before committing
        run: |
          ruff check .
          ruff format --check .
          python -m pytest
          python scripts/sync_capabilities.py --offline --check
      - name: Commit capability changes to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          paths=(openai_image_node/capabilities.json docs/api_snapshot.json docs/supported-api.md)
          if git diff --quiet -- "${paths[@]}"; then
            echo "No API capability changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'chore: sync OpenAI image API capabilities'
          git push origin "HEAD:${DEFAULT_BRANCH}"

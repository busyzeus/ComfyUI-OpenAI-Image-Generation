[project]
name = "comfyui-openai-image-generation"
version = "0.1.0"
description = "OpenAI image generation for ComfyUI with weekly API capability updates"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/busyzeus/ComfyUI-OpenAI-Image-Generation"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib --confcutdir=tests"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
